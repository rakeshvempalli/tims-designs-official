<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 300" width="600" height="300">
  <defs>
    <!-- Soft warm light gradient for lamp beam -->
    <linearGradient id="lampBeam" x1="0.5" y1="0" x2="0.5" y2="1">
      <stop offset="0%" stop-color="#FFBF8A" stop-opacity="0.95" />
      <stop offset="50%" stop-color="#FFAE6D" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#F26A1B" stop-opacity="0.1" />
    </linearGradient>
    <radialGradient id="bulbGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#FFA96B" />
    </radialGradient>
  </defs>

  <!-- Solid Signature Orange Background -->
  <rect width="600" height="300" fill="#F26A1B" />

  <!-- Master Group Centered -->
  <g transform="translate(18, 16)">
    
    <!-- ==================== HOUSE ICON WITH LAMP ==================== -->
    <g>
      <!-- Light beam cone shining down onto inner house -->
      <polygon points="182,50 148,126 216,126" fill="url(#lampBeam)" />

