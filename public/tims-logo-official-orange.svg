            stroke-linejoin="round" 
            stroke-linecap="round" />

      <!-- Pendant Cord hanging from apex -->
      <line x1="182" y1="27" x2="182" y2="43" stroke="#111111" stroke-width="4.5" stroke-linecap="round" />
      <!-- Lamp Shade -->
      <polygon points="173,52 191,52 186,43 178,43" fill="#111111" />
      <!-- Bulb -->
      <ellipse cx="182" cy="52" rx="4" ry="2.5" fill="url(#bulbGlow)" />

      <!-- Inner House Outline (Drafting line with open right wall) -->
      <path d="M 162 122 
               L 162 94 
               L 182 78 
               L 202 94" 
            fill="none" 
            stroke="#111111" 
            stroke-width="6" 
            stroke-linejoin="round" 
            stroke-linecap="round" />
    </g>

